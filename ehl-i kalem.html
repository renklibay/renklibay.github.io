<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Ehl-i Kalem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        .author-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
        }

        .author-card img {
            width: 150px;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 20px;
        }

        .author-info {
            flex: 1;
        }

        .author-info h2 {
            margin: 0 0 10px;
            color: #333;
        }

        .author-info p {
            margin: 5px 0;
            color: #555;
        }

        .works {
            margin-top: 10px;
        }

        .works li {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <h1>Ehl-i Kalem</h1>

    <!-- Örnek Yazar Kartı -->
    <div class="author-card">
        <img src="orhan_pamuk.jpg" alt="Orhan Pamuk">
        <div class="author-info">
            <h2>Orhan Pamuk</h2>
            <p><strong>Hayat Hikayesi:</strong> 1952’de İstanbul’da doğdu. Nobel Edebiyat Ödülü sahibi Türk romancı.</p>
            <ul class="works">
                <li>Kara Kitap</li>
                <li>Benim Adım Kırmızı</li>
                <li>Masumiyet Müzesi</li>
            </ul>
        </div>
    </div>

    <!-- Yeni yazar/şair eklemek için aynı yapıyı kopyalayabilirsin -->
</body>

</html>
